server.port=8081
spring.application.name=details

# Database config (example - update with your details)
spring.datasource.url=jdbc:mysql://localhost:3306/weather
spring.datasource.username={cipher}encrypt-value-here
spring.datasource.password={cipher}encrypt-value-here
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka client config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true