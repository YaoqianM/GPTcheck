spring:
  application:
    name: gateway-service
  cloud:
    config:
      uri: http://localhost:8888 # your config server port
    gateway:
      routes:
        - id: search
          uri: lb://search-service
          predicates:
            - Path=/search/**
        - id: book
          uri: lb://book-service
          predicates:
            - Path=/books/**
        # …add other routes
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
